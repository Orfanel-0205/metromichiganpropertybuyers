<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Metro Michigan Property Buyers</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: -0.5px;
        }
        .logo p {
            font-size: 0.82rem;
            color: #999;
            margin-top: 4px;
        }

        .form-group { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 7px;
            font-size: 0.95rem;
            color: #1A1A1A;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input:focus {
            border-color: #1A1A1A;
            box-shadow: 0 0 0 3px rgba(26,26,26,0.07);
            background: #fff;
        }
        input.error-field { border-color: #e53935; }
        input::placeholder { color: #bbb; }

        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 44px; }
        .pw-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            cursor: pointer; color: #bbb;
            font-size: 1rem; line-height: 1; padding: 0;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: #555; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1A1A1A;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
        }
        .btn-login:hover:not(:disabled) { background: #333; }
        .btn-login:active:not(:disabled) { transform: scale(0.99); }
        .btn-login:disabled { background: #999; cursor: not-allowed; }

        .spinner {
            display: inline-block;
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            display: none;
            background: #fff5f5;
            border: 1px solid #fca5a5;
            color: #c62828;
            padding: 10px 14px;
            border-radius: 7px;
            font-size: 0.88rem;
            margin-top: 1rem;
            text-align: center;
        }
        .error-box.show { display: block; }

        .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.5rem 0 1.25rem; }

        .footer-note {
            text-align: center;
            font-size: 0.76rem;
            color: #ccc;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo">
            <h1>METRO MICHIGAN PROPERTY BUYERS</h1>
            <p>Admin Portal</p>
        </div>

        <form id="loginForm" autocomplete="off" novalidate>
            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="pw-toggle" id="pwToggle" title="Show / hide password">👁</button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Login</button>

            <div class="error-box" id="errorBox"></div>
        </form>

        <hr class="divider">
        <p class="footer-note">Authorised personnel only &nbsp;·&nbsp; Activity is logged</p>
    </div>
</div>

<script src="/assets/js/config.js"></script>
<script>
    // Redirect if already logged in
    if (localStorage.getItem('adminToken')) {
        window.location.href = 'admin-dashboard';
    }

    // Password toggle
    document.getElementById('pwToggle').addEventListener('click', () => {
        const pw  = document.getElementById('password');
        const btn = document.getElementById('pwToggle');
        if (pw.type === 'password') {
            pw.type         = 'text';
            btn.textContent = '🙈';
        } else {
            pw.type         = 'password';
            btn.textContent = '👁';
        }
    });

    // Login submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('errorBox');
        const btn      = document.getElementById('loginBtn');

        // Clear previous errors
        errorBox.classList.remove('show');
        ['username', 'email', 'password'].forEach(id =>
            document.getElementById(id).classList.remove('error-field')
        );

        // Client-side validation
        if (!username) { highlight('username'); return showError('Username is required.'); }
        if (!email)    { highlight('email');    return showError('Email is required.'); }
        if (!password) { highlight('password'); return showError('Password is required.'); }

        // Basic email format check
        const emailOK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!emailOK) {
            highlight('email');
            return showError('Please enter a valid email address.');
        }

        // Loading state
        btn.disabled  = true;
        btn.innerHTML = '<span class="spinner"></span>Logging in...';

        try {
            const res  = await fetch(HSD_CONFIG.apiUrl('/api/admin/login'), {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, email, password })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUser', JSON.stringify(data.admin));
                window.location.href = 'admin-dashboard';
            } else {
                throw new Error(data.message || 'Login failed.');
            }

        } catch (err) {
            showError(err.message);
            btn.disabled    = false;
            btn.textContent = 'Login';
        }
    });

    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.textContent = msg;
        box.classList.add('show');
    }

    function highlight(id) {
        document.getElementById(id).classList.add('error-field');
    }
</script>
</body>
</html>
